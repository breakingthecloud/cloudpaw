[project]
name = "cloudpaw-v2"
version = "0.1.0"
description = "CloudPaw V2 (exploration): the same agent and tools, driving a MuJoCo robot through strands-robots"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "strands-robots[mujoco,onnx,tools]>=0.6.0,<0.7",
    "strands-agents>=1.65,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["integration: runs the real MuJoCo simulation (slower; downloads models and policies on first use)"]
